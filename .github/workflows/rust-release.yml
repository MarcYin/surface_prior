name: Rust crate release

# Trigger on `rs-v*` tags so this stays distinct from the existing
# Python `v*` tags that drive the surface-priors PyPI publish.
on:
  push:
    tags: ["rs-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to attach the release to (e.g. rs-v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 keeps the AVX2/FMA hot path (x86-64-v3 baseline);
          # macOS arm64 compiles the scalar resampler fallback
          # (grid.rs gates AVX2 behind cfg(target_arch = "x86_64")).
          # Omitted (covered by the sdist): aarch64-linux (cross image lacks
          # PROJ >= 9 → slow from-source build under QEMU) and x86_64 macOS
          # (macos-13 Intel runners queue for hours; Apple Silicon dominates).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            manylinux: "2_28"
            rustflags: "-C target-cpu=x86-64-v3"
          - target: aarch64-apple-darwin
            runner: macos-14
            rustflags: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # macOS: PROJ via Homebrew (Linux installs it inside the manylinux
      # container in before-script-linux below); maturin bundles the dylib.
      - name: Install PROJ (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install proj pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        env:
          # PyO3 0.22 was released before CPython 3.14. The wheel is
          # built against abi3-py39, which CPython guarantees stays
          # binary-compatible across 3.x releases. This flag tells
          # PyO3 not to refuse compilation if it sees a newer Python
          # in the build environment than it natively recognises.
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          working-directory: surface_priors_rs
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --features python --out dist
          before-script-linux: |
            # Install PROJ for proj-sys. Detect the container's package
            # manager — the x86_64 manylinux_2_28 image is AlmaLinux (dnf),
            # but the aarch64 cross image may differ (microdnf / yum / apt).
            set -e
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y epel-release || true
              dnf install -y proj-devel sqlite-devel clang
            elif command -v microdnf >/dev/null 2>&1; then
              microdnf install -y epel-release || true
              microdnf install -y proj-devel sqlite-devel clang
            elif command -v yum >/dev/null 2>&1; then
              yum install -y epel-release || true
              yum install -y proj-devel sqlite-devel clang
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y libproj-dev libsqlite3-dev clang
            else
              echo "no known package manager found in build container" >&2; exit 1
            fi
          rust-toolchain: stable
          # Override .cargo/config.toml `target-cpu=native` per-arch so the
          # wheel is portable (auditwheel/delocate bundle libproj).
          rustflags: ${{ matrix.rustflags }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: surface_priors_rs/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: surface_priors_rs
          command: sdist
          args: --out dist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: surface_priors_rs/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Attach wheels to GitHub Release
    needs: [build, sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Collect all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Show artifacts
        run: ls -la dist
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*

  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for PyPI trusted publishing — no API token
    steps:
      - name: Collect wheels + sdist
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
