# No global rustflags. The AVX2/FMA hot path is `#[target_feature]`-gated
# so it works regardless of `target-cpu`; forcing `target-cpu=native` here
# made builds non-portable (SIGILL on older CPUs) and leaked into CI cross
# builds (broke `ring` on macOS, ARM). Release wheels set a portable
# per-target baseline in .github/workflows/rust-release.yml
# (x86-64-v3 for x86_64, default for ARM). For a fast local build:
#   RUSTFLAGS="-C target-cpu=native" cargo build --release
