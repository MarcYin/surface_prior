[package]
name = "bestpixel"
version = "0.2.0"
edition = "2021"
description = "Production Rust port of the surface_priors monthly composite pipeline."

[lib]
name = "bestpixel"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "spx-build"
path = "src/bin/spx_build.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.12", features = ["json", "gzip", "rustls-tls", "stream", "http2"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
bytes = "1"
futures = "0.3"
byteorder = "1"
flate2 = "1"
libdeflater = "1"
bytemuck = "1"
moka = { version = "0.12", features = ["sync"] }
parking_lot = "0.12"
anyhow = "1"
proj = "0.30"
geo = "0.30"
geo-types = "0.7"
rayon = "1"
wide = "0.7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha1 = "0.10"
hex = "0.4"
dashmap = "6"
async-trait = "0.1"
urlencoding = "2"
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"], optional = true }
numpy = { version = "0.22", optional = true }
ndarray = { version = "0.16", optional = true }

[features]
default = []
python = ["pyo3", "numpy", "ndarray"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
